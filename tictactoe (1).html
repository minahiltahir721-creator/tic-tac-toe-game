<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --panel: #1a1a28;
    --x-color: #00f5ff;
    --o-color: #ff2d78;
    --grid: #2a2a3e;
    --glow-x: 0 0 20px #00f5ff80, 0 0 60px #00f5ff30;
    --glow-o: 0 0 20px #ff2d7880, 0 0 60px #ff2d7830;
    --text: #e0e0f0;
    --muted: #5a5a7a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
    animation: float 8s ease-in-out infinite;
  }
  .orb1 { width: 300px; height: 300px; background: #00f5ff; top: -100px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 250px; height: 250px; background: #ff2d78; bottom: -80px; right: -80px; animation-delay: 4s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, 20px) scale(1.05); }
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 16px;
  }

  /* Header */
  .header {
    text-align: center;
  }
  .title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(20px, 4vw, 36px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #00f5ff, #ff2d78);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(0,245,255,0.4));
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Mode selector */
  .mode-bar {
    display: flex;
    gap: 8px;
    background: var(--panel);
    padding: 6px;
    border-radius: 50px;
    border: 1px solid var(--grid);
  }
  .mode-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 50px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
    color: var(--muted);
    background: transparent;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, #00f5ff, #0090ff);
    color: #000;
    box-shadow: 0 0 20px rgba(0,245,255,0.4);
  }

  /* Scoreboard */
  .scoreboard {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 16px;
    padding: 12px 20px;
    width: 100%;
    max-width: 360px;
  }
  .score-item {
    flex: 1;
    text-align: center;
  }
  .score-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .score-value {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 700;
  }
  .score-item.x-score .score-value { color: var(--x-color); text-shadow: var(--glow-x); }
  .score-item.o-score .score-value { color: var(--o-color); text-shadow: var(--glow-o); }
  .score-divider {
    width: 1px;
    height: 40px;
    background: var(--grid);
  }
  .score-item.draw-score .score-value { color: var(--muted); }

  /* Status */
  .status {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    text-align: center;
    height: 20px;
    transition: all 0.3s;
  }
  .status.x-turn { color: var(--x-color); text-shadow: var(--glow-x); }
  .status.o-turn { color: var(--o-color); text-shadow: var(--glow-o); }
  .status.win { animation: pulse 0.5s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }

  /* Board */
  .board-wrapper {
    position: relative;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 14px;
    background: var(--panel);
    border-radius: 20px;
    border: 1px solid var(--grid);
    position: relative;
  }

  .cell {
    width: clamp(75px, 18vw, 100px);
    height: clamp(75px, 18vw, 100px);
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .cell:hover:not(.taken):not(.disabled) {
    border-color: rgba(0,245,255,0.4);
    background: rgba(0,245,255,0.05);
    transform: scale(1.04);
  }

  .cell.taken { cursor: default; }
  .cell.disabled { cursor: not-allowed; }

  .cell::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.3));
    pointer-events: none;
  }

  /* X symbol */
  .cell-symbol {
    font-size: 0;
    width: 52px;
    height: 52px;
    position: relative;
    transform: scale(0);
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes popIn {
    to { transform: scale(1); }
  }

  .cell-symbol.x::before,
  .cell-symbol.x::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 5px;
    background: var(--x-color);
    border-radius: 4px;
    top: 50%;
    left: 0;
    box-shadow: var(--glow-x);
    transform-origin: center;
  }
  .cell-symbol.x::before { transform: translateY(-50%) rotate(45deg); }
  .cell-symbol.x::after { transform: translateY(-50%) rotate(-45deg); }

  /* O symbol */
  .cell-symbol.o {
    width: 52px;
    height: 52px;
    border: 5px solid var(--o-color);
    border-radius: 50%;
    box-shadow: var(--glow-o), inset 0 0 15px rgba(255,45,120,0.2);
  }

  /* Win line */
  .win-overlay {
    position: absolute;
    pointer-events: none;
    z-index: 10;
    inset: 0;
    border-radius: 20px;
    overflow: hidden;
  }

  .win-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    border-radius: 4px;
    opacity: 0;
    animation: lineGrow 0.4s ease-out forwards;
  }

  @keyframes lineGrow {
    from { opacity: 0; transform: scaleX(0); }
    to { opacity: 0.6; transform: scaleX(1); }
  }

  /* Highlight winning cells */
  .cell.winner {
    border-color: rgba(255,255,255,0.5);
    animation: winGlow 0.6s ease-in-out infinite alternate;
  }

  @keyframes winGlow {
    from { box-shadow: 0 0 10px rgba(255,255,255,0.2); }
    to { box-shadow: 0 0 30px rgba(255,255,255,0.5); }
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 50px;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.25s;
    text-transform: uppercase;
  }

  .btn-primary {
    background: linear-gradient(135deg, #00f5ff, #0090ff);
    color: #000;
    box-shadow: 0 4px 20px rgba(0,245,255,0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(0,245,255,0.5); }
  .btn-primary:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--grid);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  /* Difficulty */
  .diff-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .diff-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-right: 4px;
  }
  .diff-btn {
    padding: 5px 14px;
    border-radius: 50px;
    font-size: 11px;
    letter-spacing: 1px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    border: 1px solid var(--grid);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .diff-btn.active.easy { border-color: #00ff88; color: #00ff88; background: rgba(0,255,136,0.1); }
  .diff-btn.active.medium { border-color: #ffaa00; color: #ffaa00; background: rgba(255,170,0,0.1); }
  .diff-btn.active.hard { border-color: #ff2d78; color: #ff2d78; background: rgba(255,45,120,0.1); }

  /* AI thinking indicator */
  .thinking {
    display: none;
    gap: 5px;
    align-items: center;
  }
  .thinking.show { display: flex; }
  .thinking-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--o-color);
    animation: blink 1s ease-in-out infinite;
  }
  .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
  .thinking-text { font-size: 11px; letter-spacing: 2px; color: var(--o-color); }

  /* Win modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-backdrop.show {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 24px;
    padding: 40px 50px;
    text-align: center;
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }
  .modal::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(0,245,255,0.08), transparent 60%);
    pointer-events: none;
  }
  .modal-backdrop.show .modal { transform: scale(1); }
  .modal-emoji { font-size: 52px; margin-bottom: 12px; }
  .modal-title {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .modal-title.x { color: var(--x-color); text-shadow: var(--glow-x); }
  .modal-title.o { color: var(--o-color); text-shadow: var(--glow-o); }
  .modal-title.draw { color: var(--muted); }
  .modal-sub { color: var(--muted); font-size: 14px; letter-spacing: 2px; margin-bottom: 28px; }
  .modal-btns { display: flex; gap: 12px; justify-content: center; }

  /* Particles */
  .particle {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 200;
    animation: particleFly 0.8s ease-out forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  @media (max-width: 400px) {
    .scoreboard { padding: 12px 16px; }
    .btn { padding: 10px 18px; font-size: 10px; }
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="container">
  <div class="header">
    <div class="title">TIC·TAC·TOE</div>
    <div class="subtitle">Cyber Edition</div>
  </div>

  <!-- Mode -->
  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('ai')" id="btn-ai">🤖 vs AI</button>
    <button class="mode-btn" onclick="setMode('2p')" id="btn-2p">👥 2 Player</button>
  </div>

  <!-- Difficulty (AI mode) -->
  <div class="diff-row" id="diff-row">
    <span class="diff-label">Level:</span>
    <button class="diff-btn easy active" onclick="setDiff('easy')" id="d-easy">Easy</button>
    <button class="diff-btn medium" onclick="setDiff('medium')" id="d-medium">Medium</button>
    <button class="diff-btn hard" onclick="setDiff('hard')" id="d-hard">Hard</button>
  </div>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="score-item x-score">
      <div class="score-label" id="x-label">Player X</div>
      <div class="score-value" id="score-x">0</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-item draw-score">
      <div class="score-label">Draws</div>
      <div class="score-value" id="score-d">0</div>
    </div>
    <div class="score-divider"></div>
    <div class="score-item o-score">
      <div class="score-label" id="o-label">Player O</div>
      <div class="score-value" id="score-o">0</div>
    </div>
  </div>

  <!-- Status -->
  <div class="status x-turn" id="status">X KA TURN</div>
  <div class="thinking" id="thinking">
    <div class="thinking-dot"></div>
    <div class="thinking-dot"></div>
    <div class="thinking-dot"></div>
    <span class="thinking-text">AI SOCH RAHA HAI</span>
  </div>

  <!-- Board -->
  <div class="board-wrapper">
    <div class="board" id="board">
      <div class="cell" id="c0" onclick="cellClick(0)"></div>
      <div class="cell" id="c1" onclick="cellClick(1)"></div>
      <div class="cell" id="c2" onclick="cellClick(2)"></div>
      <div class="cell" id="c3" onclick="cellClick(3)"></div>
      <div class="cell" id="c4" onclick="cellClick(4)"></div>
      <div class="cell" id="c5" onclick="cellClick(5)"></div>
      <div class="cell" id="c6" onclick="cellClick(6)"></div>
      <div class="cell" id="c7" onclick="cellClick(7)"></div>
      <div class="cell" id="c8" onclick="cellClick(8)"></div>
    </div>
    <div class="win-overlay" id="win-overlay"></div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" onclick="resetGame()">NEW GAME</button>
    <button class="btn btn-ghost" onclick="resetScore()">RESET SCORE</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-emoji" id="modal-emoji">🎉</div>
    <div class="modal-title" id="modal-title">X JEET GAYA!</div>
    <div class="modal-sub" id="modal-sub">SHAHBAASH!</div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="resetGame(); closeModal()">AGLI GAME</button>
      <button class="btn btn-ghost" onclick="closeModal()">DEKHTE RAHO</button>
    </div>
  </div>
</div>

<script>
  // ─── State ───────────────────────────────────────────────────────
  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let gameOver = false;
  let mode = 'ai'; // 'ai' or '2p'
  let difficulty = 'easy';
  let scores = { X: 0, O: 0, D: 0 };
  const WIN_COMBOS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  // ─── Mode & Difficulty ───────────────────────────────────────────
  function setMode(m) {
    mode = m;
    document.getElementById('btn-ai').classList.toggle('active', m==='ai');
    document.getElementById('btn-2p').classList.toggle('active', m==='2p');
    document.getElementById('diff-row').style.display = m==='ai' ? 'flex' : 'none';
    document.getElementById('o-label').textContent = m==='ai' ? 'AI' : 'Player O';
    resetGame(); resetScore();
  }

  function setDiff(d) {
    difficulty = d;
    ['easy','medium','hard'].forEach(x => {
      const btn = document.getElementById('d-'+x);
      btn.className = 'diff-btn ' + x + (x===d?' active':'');
    });
    resetGame();
  }

  // ─── Cell Click ──────────────────────────────────────────────────
  function cellClick(idx) {
    if (gameOver || board[idx]) return;
    if (mode==='ai' && currentPlayer==='O') return;
    makeMove(idx, currentPlayer);
  }

  function makeMove(idx, player) {
    board[idx] = player;
    renderCell(idx, player);
    spawnParticles(idx);

    const result = checkResult();
    if (result) { endGame(result); return; }

    currentPlayer = player==='X' ? 'O' : 'X';
    updateStatus();

    if (mode==='ai' && currentPlayer==='O' && !gameOver) {
      disableBoard(true);
      showThinking(true);
      const delay = difficulty==='easy'?400:difficulty==='medium'?600:800;
      setTimeout(() => {
        const aiIdx = getAIMove();
        showThinking(false);
        disableBoard(false);
        makeMove(aiIdx, 'O');
      }, delay);
    }
  }

  function renderCell(idx, player) {
    const cell = document.getElementById('c'+idx);
    cell.classList.add('taken');
    const sym = document.createElement('div');
    sym.className = 'cell-symbol ' + player.toLowerCase();
    cell.appendChild(sym);
  }

  function spawnParticles(idx) {
    const cell = document.getElementById('c'+idx);
    const rect = cell.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const color = board[idx]==='X' ? '#00f5ff' : '#ff2d78';
    for(let i=0;i<10;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `left:${cx}px;top:${cy}px;background:${color};
        --tx:${(Math.random()-0.5)*100}px;--ty:${(Math.random()-0.5)*100}px;
        animation-delay:${Math.random()*0.1}s`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 900);
    }
  }

  // ─── Result ──────────────────────────────────────────────────────
  function checkResult() {
    for(const [a,b,c] of WIN_COMBOS) {
      if(board[a] && board[a]===board[b] && board[a]===board[c])
        return { winner: board[a], combo: [a,b,c] };
    }
    if(board.every(Boolean)) return { winner: null };
    return null;
  }

  function endGame(result) {
    gameOver = true;
    disableBoard(true);

    if(result.winner) {
      scores[result.winner]++;
      updateScores();
      highlightWinners(result.combo);
      const isAI = mode==='ai' && result.winner==='O';
      showModal(result.winner, isAI);
    } else {
      scores.D++;
      updateScores();
      const st = document.getElementById('status');
      st.textContent = '🤝 BARABAR!';
      st.className = 'status';
      setTimeout(() => showModalDraw(), 600);
    }
  }

  function highlightWinners(combo) {
    combo.forEach(i => document.getElementById('c'+i).classList.add('winner'));
  }

  // ─── AI ──────────────────────────────────────────────────────────
  function getAIMove() {
    if(difficulty==='easy') return randomMove();
    if(difficulty==='medium') return Math.random()<0.5 ? minimaxMove() : randomMove();
    return minimaxMove();
  }

  function randomMove() {
    const empty = board.map((v,i)=>v?null:i).filter(i=>i!==null);
    return empty[Math.floor(Math.random()*empty.length)];
  }

  function minimaxMove() {
    let best = -Infinity, bestIdx = -1;
    board.forEach((v,i) => {
      if(!v) {
        board[i]='O';
        const score = minimax(board, 0, false);
        board[i]=null;
        if(score>best) { best=score; bestIdx=i; }
      }
    });
    return bestIdx;
  }

  function minimax(b, depth, isMax) {
    for(const [a,x,c] of WIN_COMBOS) {
      if(b[a]&&b[a]===b[x]&&b[a]===b[c]) return b[a]==='O'?10-depth:depth-10;
    }
    if(b.every(Boolean)) return 0;
    if(isMax) {
      let best=-Infinity;
      b.forEach((v,i)=>{ if(!v){b[i]='O';best=Math.max(best,minimax(b,depth+1,false));b[i]=null;} });
      return best;
    } else {
      let best=Infinity;
      b.forEach((v,i)=>{ if(!v){b[i]='X';best=Math.min(best,minimax(b,depth+1,true));b[i]=null;} });
      return best;
    }
  }

  // ─── UI Helpers ──────────────────────────────────────────────────
  function updateStatus() {
    const st = document.getElementById('status');
    if(mode==='ai') {
      st.textContent = currentPlayer==='X' ? 'AAPKA TURN (X)' : 'AI KA TURN (O)';
    } else {
      st.textContent = currentPlayer==='X' ? 'PLAYER X KA TURN' : 'PLAYER O KA TURN';
    }
    st.className = 'status ' + (currentPlayer==='X' ? 'x-turn' : 'o-turn');
  }

  function disableBoard(state) {
    document.getElementById('board').querySelectorAll('.cell:not(.taken)')
      .forEach(c => c.classList.toggle('disabled', state));
  }

  function showThinking(state) {
    document.getElementById('thinking').classList.toggle('show', state);
    document.getElementById('status').style.display = state ? 'none' : 'block';
  }

  function updateScores() {
    document.getElementById('score-x').textContent = scores.X;
    document.getElementById('score-o').textContent = scores.O;
    document.getElementById('score-d').textContent = scores.D;
  }

  // ─── Modal ───────────────────────────────────────────────────────
  function showModal(winner, isAI) {
    const emoji = winner==='X' ? '🏆' : (isAI ? '🤖' : '🏆');
    const title = winner==='X' ? (mode==='ai'?'AAP JEET GAYE!':'X JEET GAYA!') : (isAI?'AI JEET GAYA!':'O JEET GAYA!');
    const sub = winner==='X' ? 'BOHAT ACHA!' : (isAI ? 'AGLI BAAR BEHTAR KAREIN' : 'SHAHBAASH!');
    document.getElementById('modal-emoji').textContent = emoji;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-title').className = 'modal-title ' + winner.toLowerCase();
    document.getElementById('modal-sub').textContent = sub;
    setTimeout(() => document.getElementById('modal').classList.add('show'), 500);
  }

  function showModalDraw() {
    document.getElementById('modal-emoji').textContent = '🤝';
    document.getElementById('modal-title').textContent = 'BARABAR!';
    document.getElementById('modal-title').className = 'modal-title draw';
    document.getElementById('modal-sub').textContent = 'DONO BARABAR HAIN!';
    document.getElementById('modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  // ─── Reset ───────────────────────────────────────────────────────
  function resetGame() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    gameOver = false;
    showThinking(false);
    disableBoard(false);
    document.getElementById('win-overlay').innerHTML = '';
    for(let i=0;i<9;i++){
      const cell = document.getElementById('c'+i);
      cell.innerHTML='';
      cell.className='cell';
    }
    const st = document.getElementById('status');
    st.textContent = mode==='ai' ? 'AAPKA TURN (X)' : 'PLAYER X KA TURN';
    st.className = 'status x-turn';
    st.style.display = 'block';
  }

  function resetScore() {
    scores = { X:0, O:0, D:0 };
    updateScores();
  }

  // ─── Init ────────────────────────────────────────────────────────
  setMode('ai');
  setDiff('easy');
</script>
</body>
</html>
